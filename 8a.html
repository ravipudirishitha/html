<!DOCTYPE html>
<html>
<head>
    <title>Largest Number Program</title>
</head>
<body>

<script>
    // Taking three integer inputs
    var num1 = parseInt(prompt("Enter first integer:"));
    var num2 = parseInt(prompt("Enter second integer:"));
    var num3 = parseInt(prompt("Enter third integer:"));

    var message;

    if(num1 > num2 && num1 > num3) {
        message = num1 + " LARGER NUMBER";
    }
    else if(num2 > num1 && num2 > num3) {
        message = num2 + " LARGER NUMBER";
    }
    else if(num3 > num1 && num3 > num2) {
        message = num3 + " LARGER NUMBER";
    }
    else {
        message = "EQUAL NUMBERS";
    }

    // Displaying result in information dialog
    alert(message);

    // Also display in HTML page
    document.write("<h2>" + message + "</h2>");
</script>

</body>
</html>
