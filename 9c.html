<!DOCTYPE html>
<html>
<head>
<title>Registration Form Validation</title>
<script>
function validateForm() {

    var name = document.getElementById("name").value;
    var mobile = document.getElementById("mobile").value;
    var email = document.getElementById("email").value;

    // Name validation (start with alphabet, alphanumeric, minimum 6 characters)
    var namePattern = /^[A-Za-z][A-Za-z0-9]{5,}$/;

    // Mobile validation (exactly 10 digits)
    var mobilePattern = /^[0-9]{10}$/;

    // Email validation
    var emailPattern = /^[a-zA-Z0-9]+@[a-zA-Z0-9]+\.[a-zA-Z]{3}$/;

    if(!namePattern.test(name)){
        alert("Invalid Name! Name must start with alphabet and contain at least 6 alphanumeric characters.");
        return false;
    }

    if(!mobilePattern.test(mobile)){
        alert("Invalid Mobile Number! It must contain exactly 10 digits.");
        return false;
    }

    if(!emailPattern.test(email)){
        alert("Invalid Email! Format should be like xxxxxxx@xxxxxx.xxx");
        return false;
    }

    alert("Registration Successful!");
    return true;
}
</script>
</head>

<body>
<h2>Registration Form</h2>

<form onsubmit="return validateForm()">
Name: <input type="text" id="name"><br><br>

Mobile: <input type="text" id="mobile"><br><br>

Email: <input type="text" id="email"><br><br>

<input type="submit" value="Register">
</form>

</body>
</html>
