<!DOCTYPE html>
<html>
<head>
    <title>Loops Example</title>
</head>
<body>

<script>
    document.write("<h3>Using for loop:</h3>");
    for(var i = 1; i <= 10; i++) {
        document.write(i + " ");
    }

    document.write("<h3><br>Using while loop:</h3>");
    var j = 1;
    while(j <= 10) {
        document.write(j + " ");
        j++;
    }

    document.write("<h3><br>Using do-while loop:</h3>");
    var k = 1;
    do {
        document.write(k + " ");
        k++;
    } while(k <= 10);
</script>

</body>
</html>
