<!DOCTYPE html>
<html>
<head>
    <title>Object Loop Example</title>
</head>
<body>

<script>
    // Creating an object
    var student = {
        name: "Rishi",
        age: 19,
        course: "B.Tech"
    };

    document.write("<h3>Using for-in loop:</h3>");
    for (var key in student) {
        document.write(key + " : " + student[key] + "<br>");
    }

    document.write("<h3>Using for-each loop:</h3>");
    Object.entries(student).forEach(function(item) {
        document.write(item[0] + " : " + item[1] + "<br>");
    });

    document.write("<h3>Using for-of loop:</h3>");
    for (var [key, value] of Object.entries(student)) {
        document.write(key + " : " + value + "<br>");
    }
</script>

</body>
</html>
