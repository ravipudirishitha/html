<!DOCTYPE html>
<html>
<head>
<title>Number Operations</title>
<script>

function factorial() {
    let n = document.getElementById("num").value;
    let fact = 1;

    for (let i = 1; i <= n; i++) {
        fact = fact * i;
    }

    document.getElementById("result").innerHTML = "Factorial: " + fact;
}

function fibonacci() {
    let n = document.getElementById("num").value;
    let a = 0, b = 1, c;
    let series = "0 1 ";

    for (let i = 2; i < n; i++) {
        c = a + b;
        series += c + " ";
        a = b;
        b = c;
    }

    document.getElementById("result").innerHTML = "Fibonacci Series: " + series;
}

function prime() {
    let n = document.getElementById("num").value;
    let primes = "";

    for (let i = 2; i <= n; i++) {
        let flag = true;

        for (let j = 2; j < i; j++) {
            if (i % j == 0) {
                flag = false;
                break;
            }
        }

        if (flag) {
            primes += i + " ";
        }
    }

    document.getElementById("result").innerHTML = "Prime Numbers: " + primes;
}

function palindrome() {
    let n = document.getElementById("num").value;
    let temp = n;
    let rev = 0;

    while (temp > 0) {
        let r = temp % 10;
        rev = rev * 10 + r;
        temp = Math.floor(temp / 10);
    }

    if (rev == n)
        document.getElementById("result").innerHTML = "It is a Palindrome";
    else
        document.getElementById("result").innerHTML = "It is Not a Palindrome";
}

</script>
</head>

<body>

<h2>Number Operations</h2>

Enter a number:
<input type="text" id="num"><br><br>

<button onclick="factorial()">Factorial</button>
<button onclick="fibonacci()">Fibonacci</button>
<button onclick="prime()">Prime</button>
<button onclick="palindrome()">Palindrome</button>

<p id="result"></p>

</body>
</html>
